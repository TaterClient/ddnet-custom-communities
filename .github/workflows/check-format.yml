name: Check format

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["*"]

jobs:
  check-format:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
      - name: Run format check
        run: node ./scripts/format.mjs --noedit
